name: 가격 추적

on:
  schedule:
    # 매일 오전 10시(KST) = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # 봇이 생성 파일만 커밋할 때는 다시 실행하지 않는다(무한 반복 방지).
    paths-ignore:
      - prices.json
      - history.csv
      - CHANGES.md
      - index.html

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 가격 수집·비교·그래프 생성
        run: python -m tracker

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.csv CHANGES.md index.html
          # prices.json의 updated_at만 바뀐 경우는 커밋하지 않는다.
          if git diff --cached --quiet -- history.csv CHANGES.md index.html; then
            echo "가격 이력이 바뀌지 않아 커밋하지 않습니다."
          else
            git commit -m "chore: 가격 스냅샷 $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
