name: 가격 추적

on:
  schedule:
    # GitHub Actions의 cron은 정시(0분)에 몰리면 수 시간씩 밀리거나 누락된다.
    # 이 저장소에서는 예정 시각보다 15~17시간 늦게 실행되는 패턴이 반복됐다.
    # 그래서 하루 1~2회에 의존하지 않고 4시간 간격으로 6번 예약해,
    # 어떤 시각에 깨어나도 데이터가 최대 4시간 이내로 유지되게 한다.
    # 같은 날 여러 번 돌아도 history.csv의 그날 행을 교체하므로 중복되지 않고,
    # 가격 이력이 그대로면 커밋도 생기지 않는다.
    - cron: "23 0 * * *"   # 09:23 KST
    - cron: "11 4 * * *"   # 13:11 KST
    - cron: "37 8 * * *"   # 17:37 KST
    - cron: "19 12 * * *"  # 21:19 KST
    - cron: "47 16 * * *"  # 01:47 KST (다음 날)
    - cron: "31 20 * * *"  # 05:31 KST (다음 날)
  workflow_dispatch:
  push:
    branches:
      - main
    # 봇이 생성 파일만 커밋할 때는 다시 실행하지 않는다(무한 반복 방지).
    paths-ignore:
      - prices.json
      - history.csv
      - CHANGES.md
      - index.html
      - sw.js
      - assets/style.css
      - assets/app.js
      - assets/data.js
      - assets/vendor/**

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 정적 타입 검사
        run: mypy tracker

      - name: Python 단위 테스트
        run: python -m pytest -q

      - name: JS 비즈니스 로직 테스트
        run: node --test tests/test_app.js

      - name: 가격 수집·비교·그래프 생성
        run: python -m tracker

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.csv CHANGES.md index.html sw.js assets/style.css assets/app.js assets/data.js assets/vendor/chart.umd.min.js
          # prices.json의 updated_at만 바뀐 경우는 커밋하지 않는다.
          if git diff --cached --quiet -- history.csv CHANGES.md index.html sw.js assets/style.css assets/app.js assets/data.js assets/vendor/chart.umd.min.js; then
            echo "가격 이력이 바뀌지 않아 커밋하지 않습니다."
          else
            git commit -m "chore: 가격 스냅샷 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
