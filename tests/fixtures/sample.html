<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>가격 추적기 파싱 테스트용</title>
</head>
<body>
<!-- 실제 페이지(2026-11-13)의 prd_list 구조를 축약한 픽스처 -->
<div class="prd_list">
  <div class="swiper-wrapper list_area">
    <ul class="swiper-slide">
      <li class="item">
        <a href="/reservation/" target="_blank">
          <div class="img_wrap"><img src="x.jpg" class="thum"/></div>
        </a>
        <ul class="price_list">
          <li class="price_box type02">
            <div class="text_wrap">
              <p class="prd_text">
                첫방문 이벤트
              </p>
            </div>
            <div class="price_wrap">
              <p class="origin"><span class="num">52,000</span>원</p>
              <p class="discount"><span class="num">29,000</span>원</p>
            </div>
            <div class="text_wrap_long">
              <p class="prd_info">
                첫방문고객) 피코토닝 1회 체험가
              </p>
            </div>
          </li>
          <li class="price_box type02">
            <div class="text_wrap">
              <p class="prd_text">첫방문 이벤트</p>
            </div>
            <div class="price_wrap">
              <p class="origin"><span class="num">52,000</span>원</p>
              <p class="discount"><span class="num">29,000</span>원</p>
            </div>
            <div class="text_wrap_long">
              <p class="prd_info">첫방문고객) 피코토닝 1회 체험가</p>
            </div>
          </li>
          <li class="price_box type02">
            <div class="text_wrap">
              <p class="prd_text">기미&middot;잡티&middot;홍조</p>
            </div>
            <div class="price_wrap">
              <p class="origin"><span class="num">30,000</span>원</p>
              <p class="discount"><span class="num">19,000</span>원</p>
            </div>
            <div class="text_wrap_long">
              <p class="prd_info">레이저 토닝 1회</p>
            </div>
          </li>
        </ul>
      </li>
    </ul>
    <ul class="swiper-slide">
      <li class="item">
        <ul class="price_list">
          <li class="price_box type02">
            <div class="text_wrap">
              <p class="prd_text">🍫 빼빼로데이 한정특가</p>
            </div>
            <div class="price_wrap">
              <p class="origin"><span class="num">160,000</span>원</p>
              <p class="discount"><span class="num">89,000</span>원</p>
            </div>
            <div class="text_wrap_long">
              <p class="prd_info">[슬림 페이스 컷] 국산 턱 보툴리눔 톡신 50유닛, 침샘 50유닛</p>
            </div>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
